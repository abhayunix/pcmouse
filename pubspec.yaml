name: pcmouse
description: "Production Remote PC Controller Application for Android"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Icons & Styling
  cupertino_icons: ^1.0.8

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Real-time Transports & Connectivity
  crypto: ^3.0.3
  web_socket_channel: ^3.0.0
  flutter_webrtc: ^0.12.0
  flutter_bluetooth_serial: ^0.4.0

  # Scanner & QR Code Rendering
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0

  # Firebase Suite for Auth & Signaling
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0

  # Local Persistence & Utilities
  sqflite: ^2.3.3
  shared_preferences: ^2.2.2
  path: ^1.9.0
  path_provider: ^2.1.3
  file_picker: ^8.0.0
  sensors_plus: ^6.0.0
  device_info_plus: ^10.1.0
  network_info_plus: ^6.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - shared-protocol/packets/protocol_spec.json
    - assets/images/logo.png
